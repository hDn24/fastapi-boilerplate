version: "3.8"
services:
  db:
    image: postgres:15.0
    container_name: fastapi-boilerplate-db
    restart: always
    volumes:
      - ./data/db:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${DB_USER?Variable not set}
      - POSTGRES_PASSWORD=${DB_PASS?Variable not set}
      - POSTGRES_DB=${DB_NAME?Variable not set}
      - POSTGRES_INITDB_ARGS="--auth=md5"
    ports:
      - 5432:${DB_PORT?Variable not set}
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${DB_USER} -d ${DB_NAME}'"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    platform: linux/amd64
    image: fastapi-boilerplate-backend:${VERSION}
    container_name: fastapi-boilerplate-backend
    restart: on-failure
    volumes:
      - ./app:/src/app
    environment:
      - DB_HOST=${DB_HOST?Variable not set}
      - DB_PORT=${DB_PORT?Variable not set}
    ports:
      - 8000:8000
    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: fastapi-boilerplate-nginx
    volumes:
      - ./nginx/conf/app.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
    depends_on:
      - backend
